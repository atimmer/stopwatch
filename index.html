<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="A plain stopwatch that can start by itself when the speaker starts talking.">
  <title>Stopwatch</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="time" aria-live="off">00:00,00</div>

    <div class="controls">
      <button id="left" class="round gray" disabled>Lap</button>
      <button id="right" class="round green">Start</button>
    </div>

    <button id="auto" class="auto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span>Start when speaker detected</span>
    </button>

    <section id="listen" hidden>
      <div class="meter" aria-hidden="true"><div id="fill"></div><div id="mark"></div></div>
      <label class="sens">Sensitivity <input id="sens" type="range" min="0" max="100" value="50"></label>
    </section>
    <p id="status" role="status"></p>

    <ol id="laps"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
